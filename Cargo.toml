[package]
name = "agent-change-control"
version = "0.1.0"
edition = "2024"
authors = ["Beriktassuly <berektasulymuhammedali@gmail.com>"]
description = "Policy checks for scoped repository changes"
license = "MIT"
repository = "https://github.com/beriktassuly/agent-change-control"
keywords = ["git", "policy", "ci", "change-control"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
globset = "0.4.16"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
thiserror = "2.0.17"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = true
